<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>FAQ Accordéon</title>

<!-- jQuery CDN -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- CSS -->
<style>

body {

    font-family: Arial;
    margin: 50px;

}

.faq-item {

    margin-bottom: 10px;

}

.question {

    background-color: #3498db;
    color: white;
    padding: 10px;
    cursor: pointer;
    border-radius: 5px;

}

.reponse {

    display: none;
    padding: 10px;
    background-color: #ecf0f1;
    border-radius: 5px;
}

</style>

<!-- JS -->
<script src="faq.js"></script>

</head>

<body>

<h1>FAQ</h1>


<div class="faq-item">

<h3 class="question">Quelle est la capitale de la France ?</h3>

<p class="reponse">Paris est la capitale de la France.</p>

</div>


<div class="faq-item">

<h3 class="question">Qu'est-ce que jQuery ?</h3>

<p class="reponse">Une bibliothèque JavaScript rapide et concise.</p>

</div>


<div class="faq-item">

<h3 class="question">Qu'est-ce que JavaScript ?</h3>

<p class="reponse">Un langage de programmation utilisé pour rendre les pages web interactives.</p>

</div>


</body>

</html>
